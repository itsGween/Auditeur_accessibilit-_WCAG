openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - health
  /sites:
    post:
      operationId: SiteController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteDto'
      responses:
        '201':
          description: >-
            Site créé, ou site existant renvoyé si l'URL normalisée (schéma et
            domaine en minuscules, sans fragment) est déjà connue
        '401':
          description: Jeton d'accès (MUTATION_API_TOKEN) manquant ou invalide
      tags:
        - sites
      security:
        - bearer: []
    get:
      operationId: SiteController_findAll
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - sites
  /sites/{id}:
    get:
      operationId: SiteController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - sites
  /sites/{siteId}/scans:
    post:
      operationId: ScanController_create
      parameters:
        - name: siteId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: Scan exécuté de façon synchrone; renvoie le scan COMPLETED
        '401':
          description: Jeton d'accès (MUTATION_API_TOKEN) manquant ou invalide
      tags:
        - scans
      security:
        - bearer: []
    get:
      operationId: ScanController_findAllForSite
      parameters:
        - name: siteId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - scans
  /scans/{id}:
    get:
      operationId: ScanController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - scans
  /scans/{id}/report.csv:
    get:
      operationId: ReportController_getScanCsv
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: lang
          required: false
          in: query
          schema:
            default: fr
            enum:
              - fr
              - en
            type: string
      responses:
        '200':
          description: ''
      tags:
        - reports
  /scans/{id}/report.pdf:
    get:
      operationId: ReportController_getScanPdf
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: lang
          required: false
          in: query
          schema:
            default: fr
            enum:
              - fr
              - en
            type: string
      responses:
        '200':
          description: ''
      tags:
        - reports
  /sites/{id}/compliance-statement.pdf:
    get:
      operationId: ReportController_getComplianceStatementPdf
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: lang
          required: false
          in: query
          schema:
            default: fr
            enum:
              - fr
              - en
            type: string
      responses:
        '200':
          description: ''
      tags:
        - reports
info:
  title: WCAG Auditor API
  description: API pour auditer la conformité WCAG 2.1 AA des URLs publiques
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: opaque
      type: http
      description: >-
        Jeton partagé MUTATION_API_TOKEN, exigé pour les routes
        POST/PUT/PATCH/DELETE. Les routes GET restent publiques.
  schemas:
    CreateSiteDto:
      type: object
      properties:
        url:
          type: string
          description: >-
            URL publique à auditer (http ou https uniquement). Normalisée côté
            serveur : espaces retirés, schéma et domaine en minuscules, fragment
            (#...) retiré. Une URL déjà connue réutilise le site existant.
          example: https://exemple.canada.ca
        label:
          type: string
          description: Étiquette lisible pour identifier le site
          example: Site vitrine GENIXI
      required:
        - url
