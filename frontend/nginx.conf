server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (e.g. /fr/dashboard) aren't real files — always fall
    # back to index.html and let React Router handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
