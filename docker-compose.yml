services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wcag_auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-wcag_auditor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wcag_auditor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Always built from the POSTGRES_* vars + the in-network "postgres" hostname,
      # never taken from a top-level DATABASE_URL: that variable is also used for
      # local (non-Docker) backend dev pointed at localhost:5432, and docker-compose
      # would otherwise substitute that literal value here, making the container
      # try to reach itself instead of the postgres service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-wcag_auditor}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-wcag_auditor}?schema=public
      MUTATION_API_TOKEN: ${MUTATION_API_TOKEN:-change-me}
      SCAN_TIMEOUT_MS: ${SCAN_TIMEOUT_MS:-30000}
      PORT: ${BACKEND_PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite bakes VITE_* variables into the bundle at build time, so this must
      # be passed as a build arg, not a runtime `environment:` entry — the
      # frontend container is just nginx serving pre-built static files, it
      # never reads process.env at runtime.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres-data:
